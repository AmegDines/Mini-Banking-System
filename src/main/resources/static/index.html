<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Banking System</title>
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>MiniBank</h1>
            <p>Your finances, elevated.</p>
        </header>

        <main class="dashboard">
            <!-- Left Column: Actions -->
            <section class="actions-panel glass">
                <h2>Quick Actions</h2>
                
                <div class="action-card">
                    <h3>Create Account</h3>
                    <form id="createAccountForm">
                        <input type="text" id="ownerName" placeholder="Owner Name" required>
                        <input type="email" id="ownerEmail" placeholder="Email Address" required>
                        <select id="accountType" required><option value="CHECKING">Checking</option><option value="SAVINGS">Savings</option></select>
                        <input type="number" id="initialBalance" placeholder="Initial Balance" step="0.01" min="0" required>
                        <button type="submit" class="btn-primary">Create</button>
                    </form>
                </div>

                <div class="action-card">
                    <h3>Deposit / Withdraw</h3>
                    <form id="transactionForm">
                        <select id="dwAccountId" required>
                            <option value="" disabled selected>Select Account</option>
                        </select>
                        <input type="number" id="dwAmount" placeholder="Amount" step="0.01" min="0.01" required>
                        <div class="button-group">
                            <button type="button" id="depositBtn" class="btn-success">Deposit</button>
                            <button type="button" id="withdrawBtn" class="btn-danger">Withdraw</button>
                        </div>
                    </form>
                </div>

                <div class="action-card">
                    <h3>Transfer Funds</h3>
                    <form id="transferForm">
                        <select id="fromAccountId" required>
                            <option value="" disabled selected>From Account</option>
                        </select>
                        <select id="toAccountId" required>
                            <option value="" disabled selected>To Account</option>
                        </select>
                        <input type="number" id="transferAmount" placeholder="Amount" step="0.01" min="0.01" required>
                        <button type="submit" class="btn-primary">Transfer</button>
                    </form>
                </div>
            </section>

            <!-- Right Column: Account List & Notifications -->
            <section class="data-panel">
                <div class="notification-area" id="notificationArea"></div>
                
                <div class="accounts-list glass">
                    <h2>Your Accounts</h2>
                    <div id="accountsContainer" class="accounts-grid">
                        <!-- Accounts injected via JS -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
