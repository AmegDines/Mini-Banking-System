# Database connection settings
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:minibanking}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate configurations
# Create the schema automatically on startup if it doesn't exist
# We will use 'update' so it doesn't wipe our tables every restart
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console (helpful for beginners to see what JPA is doing)
spring.jpa.show-sql=true

# Tell Hibernate to use the MySQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Specify application port
server.port=8080
